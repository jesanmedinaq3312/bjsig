name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Worker Edge Function tests
        run: deno test --allow-env --allow-net supabase/functions/worker-auth/tests
      - name: Build
        run: bun run build
      - name: Dependency audit (production gate)
        run: bun audit --production
      - name: Dependency audit (all advisories)
        run: bun audit --audit-level=moderate

  public-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Public smoke tests must never contact the configured Supabase project.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_PUBLIC_SITE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run public E2E tests against local app
        run: bun run test:e2e:public

  tenant-e2e:
    # Enable only after configuring isolated staging users and URL/key.
    if: ${{ vars.MULTITENANT_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      E2E_REQUIRE_AUTH: "true"
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_USERS_JSON: ${{ secrets.E2E_ADMIN_USERS_JSON }}
      E2E_DEVELOPER_EMAIL: ${{ secrets.E2E_DEVELOPER_EMAIL }}
      E2E_DEVELOPER_PASSWORD: ${{ secrets.E2E_DEVELOPER_PASSWORD }}
      E2E_DEVELOPER_TENANTS_JSON: ${{ secrets.E2E_DEVELOPER_TENANTS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run authenticated cross-tenant tests against staging
        run: bun run test:e2e:authenticated

  tenant-rls-catalog:
    # Enable this repository variable only after adding a staging-only
    # SUPABASE_DB_URL secret. Never point this job at production.
    if: ${{ vars.SUPABASE_RLS_AUDIT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Assert RLS on every public table with tenant_id
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/audit-tenant-rls.sh
